name: API CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  commerce-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/marketspaseV2_e2e
      MONGODB_DATABASE: marketspaseV2_e2e
      JWTTOKENSECRET: ci-test-secret
      PAYSTACKTOKEN: sk_test_e2e
      PAYSTACK_BASE_URL: http://localhost:4010
      PAYSTACK_PUBLIC_KEY: pk_test_e2e
      PAYSTACK_AUTO_PAYOUT: 'false'
      PORT: '3000'
      STORE_CHECKOUT_RETURN_URL: http://localhost:4201/checkout/result
      EMAIL_HOST: ''
      EMAIL_USER: ''
      SMS_PROVIDER: disabled
      DEEPSEEK_API_KEY: ''

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run commerce smoke
        run: |
          set -euo pipefail

          node scripts/mock-paystack-server.js > /tmp/mock-paystack.log 2>&1 &
          MOCK_PID=$!
          node server.js > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$MOCK_PID" "$API_PID" 2>/dev/null || true' EXIT

          mock_ready=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4010/health > /dev/null; then mock_ready=1; break; fi
            sleep 1
          done
          if [ "$mock_ready" != "1" ]; then
            echo 'Mock Paystack did not start.'
            cat /tmp/mock-paystack.log || true
            exit 1
          fi

          api_ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null; then api_ready=1; break; fi
            sleep 1
          done
          if [ "$api_ready" != "1" ]; then
            echo 'API did not start.'
            cat /tmp/api.log || true
            exit 1
          fi

          node scripts/seed-store-e2e.js > /tmp/seed.log 2>&1 || {
            tail -n 40 /tmp/seed.log | while IFS= read -r line; do echo "::error::$line"; done
            cat /tmp/seed.log
            exit 1
          }

          node scripts/smoke-store-flow.js > /tmp/smoke.log 2>&1 || {
            tail -n 60 /tmp/smoke.log | while IFS= read -r line; do echo "::error::$line"; done
            cat /tmp/smoke.log
            echo '--- API log ---'
            tail -n 100 /tmp/api.log || true
            exit 1
          }

      - name: Publish logs on failure
        if: failure()
        run: |
          {
            echo '### API log'
            echo '```'
            tail -n 200 /tmp/api.log || true
            echo '```'
            echo '### Mock Paystack log'
            echo '```'
            tail -n 200 /tmp/mock-paystack.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '--- API log ---'
          tail -n 200 /tmp/api.log || true
          echo '--- mock Paystack log ---'
          tail -n 200 /tmp/mock-paystack.log || true
          tail -n 40 /tmp/api.log 2>/dev/null | while IFS= read -r line; do echo "::error::api: $line"; done || true
